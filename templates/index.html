<!DOCTYPE html>
<html>

<head>

<title>AI Mental Health CDSS</title>

<style>

body{
font-family: Arial;
margin:0;
background: linear-gradient(135deg,#141e30,#243b55);
color:white;
}

.container{
width:950px;
margin:auto;
margin-top:30px;
}

.title{
text-align:center;
margin-bottom:20px;
}

.subtitle{
text-align:center;
opacity:0.8;
margin-bottom:10px;
}

.accuracy{
text-align:center;
background:#0d6efd;
padding:8px;
border-radius:8px;
width:220px;
margin:auto;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:white;
color:black;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

label{
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#084298;
}

.result-box{
background:#f1f5ff;
padding:15px;
border-radius:10px;
margin-top:10px;
}

.prediction{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.graph{
margin-top:15px;
text-align:center;
}

.download{
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
AI Mental Health CDSS
</h1>

<p class="subtitle">
Clinical Decision Support System using Machine Learning
</p>

<div class="accuracy">
Model Accuracy: {{accuracy}}%
</div>

<div class="grid">

<!-- INPUT FORM -->

<div class="card">

<form method="POST">

<label>Age</label>

<input type="number" name="age" required>

<label>Sleep Hours</label>

<input type="number" step="0.1" name="sleep" required>

<label>Stress Level</label>

<select name="stress">

<option>Low</option>

<option>Moderate</option>

<option>High</option>

</select>

<label>Exercise Level</label>

<select name="exercise">

<option>Low</option>

<option>Moderate</option>

<option>High</option>

</select>

<label>Screen Time (hours)</label>

<input type="number" name="screen" min="1" max="12">

<label>Work Hours</label>

<input type="number" name="work" min="1" max="12">

<label>Social Interaction (1-10)</label>

<input type="number" name="social" min="1" max="10">

<button>
Predict Mental Health
</button>

</form>

</div>

<!-- RESULT -->

<div class="card">

{% if prediction %}

<div class="result-box">

<div class="prediction">
Prediction: {{prediction}}
</div>

<p>
{{explanation}}
</p>

<div class="graph">

<img src="/static/graph.png" width="320">

</div>

<div class="download">

<a href="/download">

<button>

Download Report (PDF)

</button>

</a>

</div>

</div>

{% else %}

<p>
Fill the form to generate prediction and report.
</p>

{% endif %}

</div>

</div>

</div>

</body>

</html>
